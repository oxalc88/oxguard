name: Temporary release verification (no publication)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  release-check:
    if: github.head_ref == 'ci/component-verification'
    uses: ./.github/workflows/npm.yml
    with:
      tag: v0.0.0-ci-verification
      sha: ${{ github.sha }}
      reuse-verification: false
  vet:
    if: github.head_ref == 'ci/component-verification'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [contract, tsguard, pyguard]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsguard/go.mod
          cache: false
      - name: Run Go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
