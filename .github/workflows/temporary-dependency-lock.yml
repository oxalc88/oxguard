name: Temporary dependency lock generation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lock:
    if: github.head_ref == 'chore/upgrade-analyzer-dependencies'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate Python evaluator lock
        run: |
          python -m pip install uv==0.12.19
          uv pip compile evals/python/requirements.in --generate-hashes --universal --python-version 3.12 --output-file evals/python/requirements.txt
          git diff -- evals/python/requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-dependency-lock
          path: evals/python/requirements.txt
          if-no-files-found: error
