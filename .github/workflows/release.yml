name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      sha: ${{ steps.verify.outputs.sha }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact annotated release tag
        id: verify
        shell: bash
        env:
          REQUESTED_TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid release tag"; exit 1;
          }
          remote_ref="refs/tags/$REQUESTED_TAG"
          remote_object="$(git ls-remote --exit-code --tags origin "$remote_ref" | awk '{print $1}')"
          test -n "$remote_object"
          git fetch --no-tags origin "$remote_ref"
          test "$(git cat-file -t "$remote_object")" = tag || {
            echo "::error::Release tag must be annotated"; exit 1;
          }
          sha="$(git rev-parse "$remote_object^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Release tag is not part of main"; exit 1;
          }
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag_object=$remote_object" >> "$GITHUB_OUTPUT"

  npm-check:
    needs: validate-release
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ needs.validate-release.outputs.tag }}
      sha: ${{ needs.validate-release.outputs.sha }}

  build:
    name: Build ${{ matrix.tool }} ${{ matrix.include_os.os }}/${{ matrix.include_os.arch }}
    runs-on: ubuntu-latest
    needs: [npm-check, validate-release]
    strategy:
      matrix:
        tool: [pyguard, tsguard]
        include_os:
          - {os: linux,   arch: amd64, ext: tar.gz, npm: linux-x64}
          - {os: linux,   arch: arm64, ext: tar.gz, npm: linux-arm64}
          - {os: darwin,  arch: amd64, ext: tar.gz, npm: darwin-x64}
          - {os: darwin,  arch: arm64, ext: tar.gz, npm: darwin-arm64}
          - {os: windows, arch: amd64, ext: zip, npm: win32-x64}
    env:
      GOOS:   ${{ matrix.include_os.os }}
      GOARCH: ${{ matrix.include_os.arch }}
      TAG:    ${{ inputs.tag || github.ref_name }}
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.sha }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.tool }}/go.mod
          cache-dependency-path: ${{ matrix.tool }}/go.sum

      - name: Build ${{ matrix.tool }}
        run: |
          BIN=${{ matrix.tool }}
          [ "$GOOS" = "windows" ] && BIN="${BIN}.exe"
          cd ${{ matrix.tool }}
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$TAG" \
            -o "../dist/${BIN}" \
            .

      - name: Package
        run: |
          TOOL=${{ matrix.tool }}
          OS=${{ matrix.include_os.os }}
          ARCH=${{ matrix.include_os.arch }}
          EXT=${{ matrix.include_os.ext }}
          NAME="${TOOL}-${TAG}-${OS}-${ARCH}"
          OUTDIR="dist/${NAME}"
          mkdir -p "$OUTDIR"

          BIN="${TOOL}"
          [ "$OS" = "windows" ] && BIN="${BIN}.exe"
          cp "dist/${BIN}" "$OUTDIR/"
          cp LICENSE "$OUTDIR/" 2>/dev/null || true

          # pyguard ships the analysis helper scripts
          if [ "$TOOL" = "pyguard" ]; then
            cp -r pyguard/analysis "$OUTDIR/"
          fi

          cd dist
          if [ "$EXT" = "zip" ]; then
            zip -r "${NAME}.zip" "${NAME}/"
            sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}/"
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          cd ..

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tool }}-${{ matrix.include_os.os }}-${{ matrix.include_os.arch }}
          path: dist/${{ matrix.tool }}-*.*
          retention-days: 1

      - uses: actions/setup-node@v4
        if: matrix.tool == 'tsguard'
        with:
          node-version: 24

      - name: Pack npm distribution
        if: matrix.tool == 'tsguard'
        env:
          PLATFORM: ${{ matrix.include_os.npm }}
        run: |
          BIN=tsguard
          [ "$GOOS" = "windows" ] && BIN=tsguard.exe
          mkdir -p "dist/binaries/$PLATFORM"
          cp "dist/$BIN" "dist/binaries/$PLATFORM/$BIN"
          node npm/fetch-native.cjs dist/binaries "$PLATFORM"
          node npm/prepare.cjs "$TAG" dist/binaries dist/npm "$PLATFORM"
          npm pack "./dist/npm/tsguard-$PLATFORM" --pack-destination dist/npm
          if [ "$PLATFORM" = "linux-x64" ]; then
            npm pack ./dist/npm/tsguard --pack-destination dist/npm
          fi

      - uses: actions/upload-artifact@v7
        if: matrix.tool == 'tsguard'
        with:
          name: npm-${{ matrix.include_os.npm }}
          path: dist/npm/*.tgz
          retention-days: 1

  release:
    name: Publish release
    needs: [build, validate-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.sha }}

      - name: Verify release tag has not moved
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release.outputs.tag_object }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" | awk '{print $1}')" = "$EXPECTED_TAG_OBJECT"
      - uses: actions/download-artifact@v8
        with:
          pattern: '*guard-*'
          path: dist
          merge-multiple: true

      - name: Generate combined checksums.txt
        run: |
          cd dist
          cat ./*.sha256 > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate-release.outputs.tag }}
          prerelease: ${{ contains(needs.validate-release.outputs.tag, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/checksums.txt
            install.sh
            install.ps1
          generate_release_notes: true

  npm-publish:
    name: Publish npm packages
    needs: [build, release, validate-release]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.validate-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - name: Verify release tag has not moved
        shell: bash
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.validate-release.outputs.tag_object }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code --tags origin "refs/tags/$TAG" | awk '{print $1}')" = "$EXPECTED_TAG_OBJECT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: dist/npm
          merge-multiple: true
      - name: Publish native packages before launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MAEZSAEN_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          for PLATFORM in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            test -f "dist/npm/oxguard-tsguard-$PLATFORM-$VERSION.tgz"
          done
          test -f "dist/npm/oxguard-tsguard-$VERSION.tgz"
          for PLATFORM in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm publish "dist/npm/oxguard-tsguard-$PLATFORM-$VERSION.tgz" --access public --tag "$DIST_TAG"
          done
          npm publish "dist/npm/oxguard-tsguard-$VERSION.tgz" --access public --tag "$DIST_TAG"
