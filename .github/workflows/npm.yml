name: npm distribution checks
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  npm:
    name: ${{ matrix.manager.name }} ${{ matrix.manager.version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        manager:
          - {name: npm, version: bundled}
          - {name: pnpm, version: 10.34.5}
          - {name: pnpm, version: 12.6.0}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsguard/go.mod
          cache-dependency-path: tsguard/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go regression tests
        if: matrix.manager.name == 'npm' && runner.os != 'Windows'
        run: go test ./...
        working-directory: tsguard
      - name: Install pnpm test tool
        if: matrix.manager.name == 'pnpm'
        run: npm install --global pnpm@${{ matrix.manager.version }}
      - name: Eval harness regression tests
        if: matrix.manager.name == 'npm'
        run: node --test evals/evals.test.cjs
      - run: node --test npm/distribution.test.cjs
        env:
          TSGUARD_PACKAGE_MANAGER: ${{ matrix.manager.name }}
          OXGUARD_EVAL_REPORT_DIR: ${{ matrix.manager.name == 'npm' && 'eval-reports' || '' }}
          OXGUARD_EVAL_REVISION: ${{ github.sha }}
          OXGUARD_EVAL_BASELINE_REF: ${{ matrix.manager.name == 'npm' && matrix.os == 'ubuntu-latest' && github.event.pull_request.base.sha || '' }}
      - name: Upload capability eval reports
        if: always() && matrix.manager.name == 'npm'
        uses: actions/upload-artifact@v4
        with:
          name: oxguard-evals-${{ matrix.os }}
          path: eval-reports/
          if-no-files-found: error
