name: npm distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

# New PR commits supersede earlier checks; release invocations keep running.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm:
    name: ${{ matrix.manager.name }} ${{ matrix.manager.version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        manager:
          - {name: npm, version: bundled}
          - {name: pnpm, version: 10.34.5}
          - {name: pnpm, version: 12.6.0}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: tsguard/go.mod
          cache-dependency-path: tsguard/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Go regression tests
        if: matrix.manager.name == 'npm' && runner.os != 'Windows'
        run: go test ./...
        working-directory: tsguard
      - name: Install pnpm test tool
        if: matrix.manager.name == 'pnpm'
        run: npm install --global pnpm@${{ matrix.manager.version }}
      - name: Eval harness regression tests
        if: matrix.manager.name == 'npm'
        run: node --test evals/evals.test.cjs evals/python/evals.test.cjs evals/agent-actions.test.cjs
      - run: node --test npm/distribution.test.cjs
        env:
          TSGUARD_PACKAGE_MANAGER: ${{ matrix.manager.name }}
          OXGUARD_EVAL_REPORT_DIR: ${{ matrix.manager.name == 'npm' && 'eval-reports' || '' }}
          OXGUARD_EVAL_REVISION: ${{ github.sha }}
          OXGUARD_EVAL_BASELINE_REF: ${{ matrix.manager.name == 'npm' && matrix.os == 'ubuntu-latest' && github.event.pull_request.base.sha || '' }}
      - name: Upload capability eval reports
        if: always() && matrix.manager.name == 'npm'
        uses: actions/upload-artifact@v4
        with:
          name: oxguard-evals-${{ matrix.os }}
          path: eval-reports/
          if-no-files-found: error

  pyguard:
    name: PyGuard evals / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: pyguard/go.mod
          cache-dependency-path: pyguard/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned eval toolchain
        shell: bash
        run: |
          python -m pip install uv==0.12.19
          uv venv --python "$(python -c 'import sys; print(sys.executable)')" "$RUNNER_TEMP/python-evals"
          EVAL_PY="$RUNNER_TEMP/python-evals/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then EVAL_PY="$RUNNER_TEMP/python-evals/Scripts/python.exe"; fi
          uv pip install --python "$EVAL_PY" --require-hashes -r evals/python/requirements.txt
          echo "EVAL_PY=$EVAL_PY" >> "$GITHUB_ENV"
      - name: Shared result contract tests
        run: go test ./...
        working-directory: contract
      - name: PyGuard regression tests
        run: go test ./...
        working-directory: pyguard
      - name: Owned helper source-location tests
        shell: bash
        run: '"$EVAL_PY" pyguard/tests/analysis_contract_test.py'
      - name: Evaluate Python behavior and contract parity
        shell: bash
        env:
          EVAL_REVISION: ${{ github.sha }}
          EVAL_BASELINE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          (cd pyguard && go build -o "$RUNNER_TEMP/pyguard-eval.exe" .)
          ARGS=(--binary "$RUNNER_TEMP/pyguard-eval.exe" --source . --python "$EVAL_PY" --revision "$EVAL_REVISION" --report-dir eval-reports/pyguard)
          if [ -n "$EVAL_BASELINE" ]; then
            git fetch --no-tags origin "$EVAL_BASELINE"
            git worktree add --detach "$RUNNER_TEMP/pyguard-baseline" "$EVAL_BASELINE"
            (cd "$RUNNER_TEMP/pyguard-baseline/pyguard" && go build -o "$RUNNER_TEMP/pyguard-baseline.exe" .)
            ARGS+=(--baseline-binary "$RUNNER_TEMP/pyguard-baseline.exe" --baseline-source "$RUNNER_TEMP/pyguard-baseline" --baseline-revision "$EVAL_BASELINE")
          fi
          node evals/python/run.cjs "${ARGS[@]}"
      - name: Upload Python behavior and parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oxguard-python-evals-${{ matrix.os }}
          path: eval-reports/pyguard/
          if-no-files-found: error

  parity:
    name: Report shared capabilities and outstanding gaps
    needs: [npm, pyguard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: oxguard-evals-ubuntu-latest
          path: eval-reports/tsguard
      - uses: actions/download-artifact@v4
        with:
          name: oxguard-python-evals-ubuntu-latest
          path: eval-reports/pyguard
      - name: Produce parity matrix (gaps are not passes)
        run: node evals/parity.cjs eval-reports/tsguard/npm-linux-x64/candidate.json eval-reports/pyguard/candidate/behavior.json eval-reports/pyguard/candidate/parity.json eval-reports/parity.json
      - name: Require Level 1 agent contract completion
        run: node evals/level1-ready.cjs eval-reports/tsguard/npm-linux-x64/candidate.json eval-reports/pyguard/candidate/behavior.json eval-reports/pyguard/candidate/parity.json eval-reports/level1-ready.json
      - uses: actions/upload-artifact@v4
        with:
          name: oxguard-capability-parity
          path: |
            eval-reports/parity.json
            eval-reports/parity.md
            eval-reports/level1-ready.json
          if-no-files-found: error
