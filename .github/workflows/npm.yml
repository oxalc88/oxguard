name: npm distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact candidate commit (empty uses the dispatch commit)
        type: string
        required: false
      reuse-verification:
        description: Reuse matching trusted main verification; never publish
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        type: string
        required: false
      reuse-verification:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

# New PR commits supersede earlier checks; release invocations keep running.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Detect docs-only change
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files || 0 }}
        run: |
          # Docs-only list: *.md anywhere except tsguard/skill/ and pyguard/skill/,
          # plus docs/** (any file type), LICENSE and .github/ISSUE_TEMPLATE/**.
          # Renamed or copied files always run fully: a docs-only destination can hide a code change.
          # API failure, zero files or more than 3000 files keep docs_only=false (full run).
          docs_only=false
          case "${CHANGED_FILES:-0}" in
            ''|*[!0-9]*) CHANGED_FILES=3001 ;;
          esac
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ] && [ "$CHANGED_FILES" -le 3000 ]; then
            if rows="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')"; then
              count=0
              eligible=true
              while IFS=$'\t' read -r status file previous; do
                [ -n "$file" ] || continue
                count=$((count + 1))
                case "$status" in
                  renamed|copied)
                    eligible=false
                    break
                    ;;
                esac
                if [ -n "$previous" ]; then
                  eligible=false
                  break
                fi
                case "$file" in
                  tsguard/skill/*|pyguard/skill/*)
                    eligible=false
                    break
                    ;;
                  docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|*.md) ;;
                  *)
                    eligible=false
                    break
                    ;;
                esac
              done <<< "$rows"
              if [ "$eligible" = true ] && [ "$count" -gt 0 ] && [ "$count" -le 3000 ]; then
                docs_only=true
              fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only decision: docs_only=$docs_only (event=$EVENT_NAME, changed_files=$CHANGED_FILES)"

  npm:
    name: ${{ matrix.manager.name }} ${{ matrix.manager.version }} / ${{ matrix.os }}
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        manager:
          - {name: npm, version: bundled}
          - {name: pnpm, version: 10.34.5}
          - {name: pnpm, version: 12.6.0}
    env:
      REUSE_VERIFICATION: ${{ inputs.reuse-verification || false }}
      TSGUARD_PACKAGE_MANAGER: ${{ matrix.manager.name }}
      VERIFICATION_SUITE: npm
      VERIFICATION_GROUP: npm-${{ matrix.os }}-${{ matrix.manager.name }}-${{ matrix.manager.version }}
      VERIFICATION_ARTIFACT: oxguard-evals-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        if: needs.scope.outputs.docs_only != 'true'
        with:
          ref: ${{ inputs.sha || inputs.tag || github.sha }}
      - uses: actions/setup-go@v6
        if: needs.scope.outputs.docs_only != 'true'
        with:
          go-version-file: tsguard/go.mod
          cache-dependency-path: tsguard/go.sum
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
      - name: Install pnpm test tool
        if: needs.scope.outputs.docs_only != 'true' && (matrix.manager.name == 'pnpm')
        run: npm install --global pnpm@${{ matrix.manager.version }}
      - name: Find trusted verification for these inputs
        if: needs.scope.outputs.docs_only != 'true' && (matrix.manager.name == 'npm')
        id: evidence
        run: node scripts/verification-evidence.cjs lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore trusted verification reports
        if: needs.scope.outputs.docs_only != 'true' && (steps.evidence.outputs.run_id != '')
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFICATION_ARTIFACT }}
          path: eval-reports
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
      - name: Validate restored inputs and reports
        if: needs.scope.outputs.docs_only != 'true' && (matrix.manager.name == 'npm')
        id: reuse
        run: node scripts/verification-evidence.cjs check eval-reports
      - name: Go regression tests
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true' && matrix.manager.name == 'npm' && runner.os != 'Windows')
        run: go test ./...
        working-directory: tsguard
      - name: Eval harness regression tests
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true' && matrix.manager.name == 'npm')
        run: node --test scripts/verification-evidence.test.cjs evals/evals.test.cjs evals/python/evals.test.cjs evals/python/maintainability.test.cjs evals/agent-actions.test.cjs evals/record-agent-command.test.cjs evals/maintainability-parity.test.cjs tsguard/analysis/change-metrics.test.cjs
      - name: Fresh distribution verification (unlocked npm transitive dependencies)
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          node -e "require('node:fs').rmSync('eval-reports', { recursive: true, force: true })"
          node --test npm/distribution.test.cjs
        env:
          TSGUARD_PACKAGE_MANAGER: ${{ matrix.manager.name }}
          OXGUARD_EVAL_REPORT_DIR: ${{ matrix.manager.name == 'npm' && 'eval-reports' || '' }}
          OXGUARD_EVAL_REVISION: ${{ inputs.sha || github.sha }}
          OXGUARD_EVAL_BASELINE_REF: ${{ matrix.manager.name == 'npm' && matrix.os == 'ubuntu-latest' && github.event.pull_request.base.sha || '' }}
      - name: Record successful verification inputs
        if: needs.scope.outputs.docs_only != 'true' && (matrix.manager.name == 'npm')
        run: node scripts/verification-evidence.cjs record eval-reports
      - name: Upload capability eval reports
        if: always() && needs.scope.outputs.docs_only != 'true' && (matrix.manager.name == 'npm')
        uses: actions/upload-artifact@v4
        with:
          name: oxguard-evals-${{ matrix.os }}
          path: eval-reports/
          if-no-files-found: error
      - name: Docs-only fast path
        if: needs.scope.outputs.docs_only == 'true'
        run: |
          echo "Docs-only pull request: npm distribution checks are skipped; reporting success under the same check name."

  pyguard:
    name: PyGuard evals / ${{ matrix.os }}
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      REUSE_VERIFICATION: ${{ inputs.reuse-verification || false }}
      VERIFICATION_SUITE: pyguard
      VERIFICATION_GROUP: pyguard-${{ matrix.os }}
      VERIFICATION_ARTIFACT: oxguard-python-evals-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        if: needs.scope.outputs.docs_only != 'true'
        with:
          ref: ${{ inputs.sha || inputs.tag || github.sha }}
      - uses: actions/setup-go@v6
        if: needs.scope.outputs.docs_only != 'true'
        with:
          go-version-file: pyguard/go.mod
          cache-dependency-path: pyguard/go.sum
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        if: needs.scope.outputs.docs_only != 'true'
        with:
          python-version: '3.12'
      - name: Install pinned eval toolchain
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          python -m pip install uv==0.12.19
          uv venv --python "$(python -c 'import sys; print(sys.executable)')" "$RUNNER_TEMP/python-evals"
          EVAL_PY="$RUNNER_TEMP/python-evals/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then EVAL_PY="$RUNNER_TEMP/python-evals/Scripts/python.exe"; fi
          uv pip install --python "$EVAL_PY" --require-hashes -r evals/python/requirements.txt
          echo "EVAL_PY=$EVAL_PY" >> "$GITHUB_ENV"
      - name: Find trusted verification for these inputs
        if: needs.scope.outputs.docs_only != 'true'
        id: evidence
        run: node scripts/verification-evidence.cjs lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore trusted verification reports
        if: needs.scope.outputs.docs_only != 'true' && (steps.evidence.outputs.run_id != '')
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.VERIFICATION_ARTIFACT }}
          path: eval-reports/pyguard
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
      - name: Validate restored inputs and reports
        if: needs.scope.outputs.docs_only != 'true'
        id: reuse
        run: node scripts/verification-evidence.cjs check eval-reports/pyguard
      - name: Repository identity hook regression tests
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true')
        shell: bash
        run: |
          python scripts/test-identity-hooks.py
          python scripts/test-release-docs.py
          python -m unittest discover -s experiments/test-selection -p "test_*.py"
      - name: Shared result contract tests
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true')
        run: go test ./...
        working-directory: contract
      - name: PyGuard regression tests
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true')
        run: go test ./...
        working-directory: pyguard
      - name: Owned helper source-location tests
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true')
        shell: bash
        run: '"$EVAL_PY" pyguard/tests/analysis_contract_test.py'
      - name: Evaluate Python behavior and contract parity
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true')
        shell: bash
        env:
          EVAL_REVISION: ${{ inputs.sha || github.sha }}
          EVAL_BASELINE: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          (cd pyguard && go build -o "$RUNNER_TEMP/pyguard-eval.exe" .)
          ARGS=(--binary "$RUNNER_TEMP/pyguard-eval.exe" --source . --python "$EVAL_PY" --revision "$EVAL_REVISION" --report-dir eval-reports/pyguard)
          if [ -n "$EVAL_BASELINE" ]; then
            git fetch --no-tags origin "$EVAL_BASELINE"
            git worktree add --detach "$RUNNER_TEMP/pyguard-baseline" "$EVAL_BASELINE"
            (cd "$RUNNER_TEMP/pyguard-baseline/pyguard" && go build -o "$RUNNER_TEMP/pyguard-baseline.exe" .)
            ARGS+=(--baseline-binary "$RUNNER_TEMP/pyguard-baseline.exe" --baseline-source "$RUNNER_TEMP/pyguard-baseline" --baseline-revision "$EVAL_BASELINE")
          fi
          node evals/python/run.cjs "${ARGS[@]}"
      - name: Evaluate Python maintainability parity
        if: needs.scope.outputs.docs_only != 'true' && (steps.reuse.outputs.hit != 'true')
        shell: bash
        run: |
          node evals/python/maintainability.cjs --binary "$RUNNER_TEMP/pyguard-eval.exe" --python "$EVAL_PY" --output eval-reports/pyguard/maintainability.json
      - name: Record successful verification inputs
        if: needs.scope.outputs.docs_only != 'true'
        run: node scripts/verification-evidence.cjs record eval-reports/pyguard
      - name: Upload Python behavior and parity reports
        if: always() && needs.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oxguard-python-evals-${{ matrix.os }}
          path: eval-reports/pyguard/
          if-no-files-found: error
      - name: Docs-only fast path
        if: needs.scope.outputs.docs_only == 'true'
        run: |
          echo "Docs-only pull request: PyGuard evals are skipped; reporting success under the same check name."

  # Recorded agent traces: informative on pull requests, never a merge blocker.
  agent-evals:
    name: Agent traces (non-blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Detect skill or agent eval changes
        id: changed
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -E '^[^/]+/skill/|^evals/(agent-|agent-traces/|agent-capture/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Score recorded agent traces
        if: steps.changed.outputs.run == 'true'
        run: node evals/agent-actions.cjs > agent-evals.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.run == 'true'
        with:
          name: oxguard-agent-evals
          path: agent-evals.json

  parity:
    name: Report shared capabilities and outstanding gaps
    needs: [scope, npm, pyguard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: needs.scope.outputs.docs_only != 'true'
        with:
          ref: ${{ inputs.sha || inputs.tag || github.sha }}
      - uses: actions/setup-node@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          name: oxguard-evals-ubuntu-latest
          path: eval-reports/tsguard
      - uses: actions/download-artifact@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          name: oxguard-python-evals-ubuntu-latest
          path: eval-reports/pyguard
      - name: Produce parity matrix (gaps are not passes)
        if: needs.scope.outputs.docs_only != 'true'
        run: |
          node evals/parity.cjs eval-reports/tsguard/npm-linux-x64/candidate.json eval-reports/pyguard/candidate/behavior.json eval-reports/pyguard/candidate/parity.json eval-reports/parity.json
          node evals/maintainability-parity.cjs eval-reports/tsguard/maintainability.json eval-reports/pyguard/maintainability.json > eval-reports/maintainability-parity.json
      - name: Require Level 1 contract completion (agent traces block releases only)
        if: needs.scope.outputs.docs_only != 'true'
        env:
          OXGUARD_REQUIRE_CURRENT_TRACES: ${{ inputs.tag && '1' || '0' }}
        run: node evals/level1-ready.cjs eval-reports/tsguard/npm-linux-x64/candidate.json eval-reports/pyguard/candidate/behavior.json eval-reports/pyguard/candidate/parity.json eval-reports/level1-ready.json
      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.docs_only != 'true'
        with:
          name: oxguard-capability-parity
          path: |
            eval-reports/parity.json
            eval-reports/parity.md
            eval-reports/level1-ready.json
            eval-reports/maintainability-parity.json
          if-no-files-found: error
      - name: Docs-only fast path
        if: needs.scope.outputs.docs_only == 'true'
        run: |
          echo "Docs-only pull request: the parity report is skipped; reporting success under the same check name."
